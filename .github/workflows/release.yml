name: Build & Release

# Triggered by upload.sh pushing a version tag (v*), or manually from the
# Actions tab. Builds a double-click desktop package for Windows, macOS and
# Linux in parallel, smoke-tests each one, then (on a tag push) publishes
# them all as assets on a GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v5

      - name: Work out the version from the tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "AUGA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "AUGA_VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          chmod +x build/build.sh
          ./build/build.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/build.ps1

      # Launches the packaged app with its real window (native window on
      # Windows/macOS; Chrome app window on Linux, on a virtual display), runs
      # a bundled example script on the bundled Python, checks a second launch
      # brings back the running app, then quits it.
      - name: Smoke test
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)
              uv run --no-project --python 3.12 build/smoke_test.py \
                "dist/AUGA-Builder.app/Contents/MacOS/AUGA-Builder" --expect-mode window ;;
            Windows)
              uv run --no-project --python 3.12 build/smoke_test.py \
                "dist/AUGA-Builder/AUGA-Builder.exe" --expect-mode window,app-window ;;
            *)
              xvfb-run -a uv run --no-project --python 3.12 build/smoke_test.py \
                "dist/AUGA-Builder/AUGA-Builder" --expect-mode app-window,browser ;;
          esac

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUGA-Builder-${{ runner.os }}
          path: dist/AUGA-Builder-*.*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
