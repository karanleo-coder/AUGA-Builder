name: Build & Release

# Triggered by upload.sh pushing a version tag (v*), or manually from the
# Actions tab. Builds a double-click desktop package for Windows, macOS and
# Linux in parallel, smoke-tests each one, then (on a tag push) publishes
# them all as assets on a GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: astral-sh/setup-uv@v5

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          chmod +x build/build.sh
          ./build/build.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/build.ps1

      - name: Smoke test (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          ./dist/AUGA-Builder/AUGA-Builder &
          APP_PID=$!
          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8756/api/health > /dev/null; then ok=1; break; fi
            sleep 1
          done
          kill "$APP_PID" 2>/dev/null || true
          if [ -z "$ok" ]; then
            echo "::error::packaged app never answered /api/health"
            cat dist/AUGA-Builder/data/launcher.log 2>/dev/null || true
            exit 1
          fi
          echo "Smoke test passed."

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -FilePath "dist\AUGA-Builder\AUGA-Builder.exe"
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8756/api/health" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          Get-Process "AUGA-Builder" -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) {
            Write-Error "packaged app never answered /api/health"
            Get-Content dist\AUGA-Builder\data\launcher.log -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Smoke test passed."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AUGA-Builder-${{ runner.os }}
          path: dist/AUGA-Builder-*.*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
